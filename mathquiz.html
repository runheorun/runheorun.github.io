<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>점대칭도형 스피드퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5ff;--card:#fff;--ink:#1b2559;--sub:#5a648f;--ok:#0f9d58;--no:#e5484d;--acc:#ffc93c;--line:#d5ddf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1330;--card:#1a2048;--ink:#eef1ff;--sub:#9aa6dd;--line:#2e3768}}
:root[data-theme="dark"]{--bg:#0f1330;--card:#1a2048;--ink:#eef1ff;--sub:#9aa6dd;--line:#2e3768}
*{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:14px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.top b{font-size:26px}
.bar{height:14px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--acc);transition:width .1s linear}
.bar.low i{background:var(--no)}
.stage{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:20px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.stage svg{width:74%;height:74%;margin-top:-6%}
.msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:20px;min-height:28px;line-height:1.3}
.msg small{font-size:15px;color:var(--sub)}
.stage{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.combo{position:absolute;top:10px;right:14px;font-size:22px;color:var(--sub)}
.stage.ok{border-color:var(--ok)}.stage.no{border-color:var(--no)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;font:inherit;font-size:26px;padding:18px 8px;border:3px solid var(--ink);border-radius:18px;color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
.y{background:var(--ok)}.n{background:var(--no)}
.panel{position:absolute;inset:0;background:var(--card);border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;overflow:auto}
.panel h1{margin:0;font-size:34px;line-height:1.2}
.panel p{margin:0;color:var(--sub);font-size:18px;line-height:1.5}
.panel .go{background:var(--acc);color:#1b2559;margin-top:6px;padding:14px 36px}
.big{font-size:56px}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:16px}
.miss span{border:2px solid var(--line);border-radius:10px;padding:3px 9px}
.hide{display:none!important}
.shake{animation:s .25s}
@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style></head><body>
<main>
<div class="top"><div>점수 <b id="sc">0</b></div><div>⏱ <b id="tm">60</b></div></div>
<div class="bar" id="bar"><i id="fill"></i></div>
<div class="stage" id="stage">
<div class="combo" id="cb"></div>
<svg id="svg" viewBox="-10 -10 120 120" role="img" aria-label="도형"></svg>
<div class="msg" id="msg" aria-live="polite"></div>
<div class="panel" id="start">
<h1>점대칭도형<br>스피드퀴즈</h1>
<p>도형이 나오면 점대칭도형인지 재빨리 골라요.<br>60초 · 오답은 시간 2초 감소<br>답을 고르면 바로 다음 문제가 나와요</p>
<p id="bestS"></p>
<button class="go" id="goBtn">시작하기</button>
</div>
<div class="panel hide" id="end">
<div class="big" id="fs">0</div>
<p id="fd"></p>
<p>헷갈린 도형</p>
<div class="miss" id="miss"></div>
<button class="go" id="again">다시 하기</button>
</div>
</div>
<div class="btns">
<button class="y" id="by">점대칭 ○</button>
<button class="n" id="bn">아니야 ✕</button>
</div>
</main>
<script>
const P=(n,r=38,o=-90)=>Array.from({length:n},(_,i)=>{const a=(o+360*i/n)*Math.PI/180;return[50+r*Math.cos(a),50+r*Math.sin(a)]});
const star5=Array.from({length:10},(_,i)=>{const a=(-90+36*i)*Math.PI/180,r=i%2?16:38;return[50+r*Math.cos(a),50+r*Math.sin(a)]});
const S=[
{n:'평행사변형',s:1,p:[[15,70],[65,70],[85,30],[35,30]]},
{n:'직사각형',s:1,p:[[14,30],[86,30],[86,70],[14,70]]},
{n:'마름모',s:1,p:[[50,12],[86,50],[50,88],[14,50]]},
{n:'정사각형',s:1,p:[[22,22],[78,22],[78,78],[22,78]]},
{n:'정육각형',s:1,p:P(6)},
{n:'정팔각형',s:1,p:P(8,38,-67.5)},
{n:'원',s:1,e:'<circle cx="50" cy="50" r="36"/>'},
{n:'더하기(+) 모양',s:1,p:[[38,14],[62,14],[62,38],[86,38],[86,62],[62,62],[62,86],[38,86],[38,62],[14,62],[14,38],[38,38]]},
{n:'S자 모양',s:1,p:[[15,25],[55,25],[55,45],[85,45],[85,75],[45,75],[45,55],[15,55]]},
{n:'H 모양',s:1,p:[[20,15],[40,15],[40,42],[60,42],[60,15],[80,15],[80,85],[60,85],[60,58],[40,58],[40,85],[20,85]]},
{n:'네 갈래 별',s:1,p:[[50,8],[60,40],[92,50],[60,60],[50,92],[40,60],[8,50],[40,40]]},
{n:'정삼각형',s:0,p:[[50,14],[86,76],[14,76]]},
{n:'직각삼각형',s:0,p:[[20,18],[20,82],[82,82]]},
{n:'등변사다리꼴',s:0,p:[[30,28],[70,28],[88,72],[12,72]]},
{n:'사다리꼴',s:0,p:[[20,30],[62,30],[86,72],[14,72]]},
{n:'정오각형',s:0,p:P(5)},
{n:'정칠각형',s:0,p:P(7)},
{n:'연 모양(방패연)',s:0,p:[[50,10],[76,40],[50,90],[24,40]]},
{n:'화살표',s:0,p:[[14,38],[54,38],[54,18],[88,50],[54,82],[54,62],[14,62]]},
{n:'T 모양',s:0,p:[[15,18],[85,18],[85,40],[61,40],[61,85],[39,85],[39,40],[15,40]]},
{n:'L 모양',s:0,p:[[25,15],[47,15],[47,63],[80,63],[80,85],[25,85]]},
{n:'별(오각)',s:0,p:star5},
{n:'반원',s:0,e:'<path d="M12 64A38 38 0 0 1 88 64Z"/>'},
{n:'하트',s:0,e:'<path d="M50 86C8 56 12 20 35 20C45 20 50 28 50 36C50 28 55 20 65 20C88 20 92 56 50 86Z"/>'}
];
const R=(p,d)=>p.map(([x,y])=>{const a=d*Math.PI/180,c=Math.cos(a),s=Math.sin(a),u=x-50,v=y-50;return[50+u*c-v*s,50+u*s+v*c]});
const ST=(n,a,b)=>Array.from({length:2*n},(_,i)=>{const t=(-90+180*i/n)*Math.PI/180,r=i%2?b:a;return[50+r*Math.cos(t),50+r*Math.sin(t)]});
const plus=[[38,14],[62,14],[62,38],[86,38],[86,62],[62,62],[62,86],[38,86],[38,62],[14,62],[14,38],[38,38]];
S.push(
{n:'X 모양',s:1,p:R(plus,45)},
{n:'I 모양(가로)',s:1,p:[[20,20],[80,20],[80,38],[59,38],[59,62],[80,62],[80,80],[20,80],[20,62],[41,62],[41,38],[20,38]]},
{n:'N 모양',s:1,p:[[18,82],[18,18],[38,18],[62,56],[62,18],[82,18],[82,82],[62,82],[38,44],[38,82]]},
{n:'타원',s:1,e:'<ellipse cx="50" cy="50" rx="38" ry="22"/>'},
{n:'정십이각형',s:1,p:P(12)},
{n:'여섯 갈래 별',s:1,p:ST(6,38,22)},
{n:'여덟 갈래 별',s:1,p:ST(8,38,20)},
{n:'바람개비',s:1,e:[0,90,180,270].map(a=>`<polygon transform="rotate(${a} 50 50)" points="50,50 50,12 82,28"/>`).join('')},
{n:'숫자 8 모양',s:1,e:'<circle cx="50" cy="31" r="19"/><circle cx="50" cy="69" r="19"/>'},
{n:'타원 고리',s:1,e:'<path fill-rule="evenodd" d="M12 50a38 36 0 1 0 76 0a38 36 0 1 0-76 0ZM30 50a20 18 0 1 0 40 0a20 18 0 1 0-40 0Z"/>'},
{n:'사각 고리',s:1,e:'<path fill-rule="evenodd" d="M16 16H84V84H16ZM36 36V64H64V36Z"/>'},
{n:'뾰족한 마름모',s:1,p:[[50,6],[70,50],[50,94],[30,50]]},
{n:'E 모양',s:0,p:[[22,14],[80,14],[80,32],[42,32],[42,43],[72,43],[72,57],[42,57],[42,68],[80,68],[80,86],[22,86]]},
{n:'F 모양',s:0,p:[[25,14],[80,14],[80,34],[46,34],[46,46],[72,46],[72,64],[46,64],[46,86],[25,86]]},
{n:'U 모양',s:0,p:[[20,16],[40,16],[40,62],[60,62],[60,16],[80,16],[80,84],[20,84]]},
{n:'A 모양',s:0,p:[[50,12],[82,88],[64,88],[58,70],[42,70],[36,88],[18,88]]},
{n:'집 모양',s:0,p:[[50,12],[86,40],[86,86],[14,86],[14,40]]},
{n:'이등변삼각형',s:0,p:[[50,10],[74,88],[26,88]]},
{n:'일반 사각형',s:0,p:[[16,70],[40,20],[84,34],[70,82]]},
{n:'십자가',s:0,p:[[40,10],[60,10],[60,32],[82,32],[82,50],[60,50],[60,90],[40,90],[40,50],[18,50],[18,32],[40,32]]},
{n:'계단 모양',s:0,p:[[14,86],[14,60],[38,60],[38,36],[62,36],[62,12],[86,12],[86,86]]},
{n:'번개',s:0,p:[[55,10],[22,55],[44,55],[36,90],[78,40],[54,40],[70,10]]},
{n:'정구각형',s:0,p:P(9)},
{n:'부채꼴',s:0,e:'<path d="M50 86L15 51A49.5 49.5 0 0 1 85 51Z"/>'},
{n:'초승달',s:0,e:'<path d="M60 14A38 38 0 1 0 60 86A30 30 0 1 1 60 14Z"/>'},
{n:'물방울',s:0,e:'<path d="M50 12C50 12 20 46 20 64A30 30 0 0 0 80 64C80 46 50 12 50 12Z"/>'}
);
const C=['#ff8fa3','#6cc3ff','#8ee3a1','#ffd166','#c3a6ff','#ff9f68'];
const $=id=>document.getElementById(id);
let score,combo,endAt,running,cur,rot,col,last=-1,locked,miss,right,total,timer,best=0,pauseAt=0;
try{best=+localStorage.getItem('psq-best')||0}catch(e){}
const shape=it=>it.p?`<polygon points="${it.p.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`:it.e;
function render(rev){
 const g=shape(cur);
 $('svg').innerHTML=`<g transform="rotate(${rot} 50 50)"><g fill="${col}" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round">${g}</g>`+
 (rev?`<g transform="rotate(180 50 50)" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 4" opacity=".7">${g}</g><circle cx="50" cy="50" r="3" fill="var(--ink)"/>`:'')+`</g>`;
}
function next(){
 let i;do{i=Math.random()*S.length|0}while(i===last);last=i;cur=S[i];
 rot=Math.random()*360|0;col=C[Math.random()*C.length|0];if(pauseAt){endAt+=Date.now()-pauseAt;pauseAt=0}locked=false;
 $('stage').className='stage';$('msg').textContent='';render(false);
}
function hud(){
 const left=Math.max(0,endAt-Date.now());
 $('tm').textContent=Math.ceil(left/1000);
 $('fill').style.width=(left/600)+'%';
 $('bar').classList.toggle('low',left<10000);
 if(left<=0)finish();
}
function start(){
 score=0;combo=0;right=0;total=0;miss=[];running=true;last=-1;
 endAt=Date.now()+60000;locked=false;pauseAt=0;
 $('sc').textContent=0;$('cb').textContent='';
 $('start').classList.add('hide');$('end').classList.add('hide');
 clearInterval(timer);timer=setInterval(hud,100);hud();next();
}
function answer(v){
 if(!running||locked)return;
 locked=true;total++;
 const ok=v===!!cur.s,st=$('stage');
 if(ok){right++;combo++;score+=10+Math.min(combo-1,10)*2;st.classList.add('ok')}
 else{combo=0;score=Math.max(0,score-5);endAt-=2000;miss.push(cur);st.classList.add('no','shake')}
 $('sc').textContent=score;
 $('cb').textContent=combo>1?combo+'연속!':'';
 $('msg').textContent=`${cur.n}: 점대칭도형이${cur.s?'에요':' 아니에요'}`;
 render(true);
 setTimeout(()=>{if(running)next()},ok?600:1200);
}
function finish(){
 if(!running)return;
 running=false;clearInterval(timer);
 $('tm').textContent=0;$('fill').style.width='0%';
 const nb=score>best;if(nb){best=score;try{localStorage.setItem('psq-best',best)}catch(e){}}
 $('fs').textContent=score+'점';
 $('fd').textContent=`${total}문제 중 ${right}개 정답`+(nb&&score>0?' · 새 최고 기록!':` · 최고 ${best}점`);
 const names=[...new Set(miss.map(m=>m.n))];
 $('miss').innerHTML=names.length?names.map(n=>`<span>${n}</span>`).join(''):'<span>없음, 완벽해요!</span>';
 $('end').classList.remove('hide');
}
$('goBtn').onclick=start;$('again').onclick=start;
$('by').onclick=()=>answer(true);$('bn').onclick=()=>answer(false);
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')answer(true);else if(e.key==='ArrowRight')answer(false);
 else if(e.key==='Enter'&&!running)start();
});
if(best)$('bestS').textContent='최고 기록 '+best+'점';
</script></body></html>
